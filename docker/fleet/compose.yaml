# One outbound worker per Docker host. Duplicate with a distinct state/credential.
services:
  worker:
    profiles: [fleet-worker]
    image: ${FLEET_WORKER_IMAGE:?Set a verified worker image digest}
    build:
      context: ../..
      dockerfile: docker/fleet/worker.Dockerfile
      network: none
      args:
        WORKER_BASE: ${FLEET_WORKER_BASE:?Set a frozen Python base digest}
        DOCKER_CLI_SHA256: ${FLEET_DOCKER_CLI_SHA256:?Set the verified Linux Docker CLI artifact SHA256}
      additional_contexts:
        fleet_artifacts: ${FLEET_BUILD_ARTIFACTS:?Set the offline artifact directory}
    restart: "no"
    read_only: true
    init: true
    stop_grace_period: 60s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - type: bind
        source: ${FLEET_WORKER_SETTINGS:?Set the worker JSON file}
        target: /etc/fleet/worker.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FLEET_WORKER_CREDENTIAL:?Set the private node credential file}
        target: /run/fleet/credential
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FLEET_WORKER_STATE:?Set a persistent private state directory}
        target: /var/lib/deerflow-fleet
        bind:
          create_host_path: false
      - type: bind
        source: ${FLEET_NAS_ROOT:?Set the same absolute host NAS path}
        target: ${FLEET_NAS_ROOT:?Set the same absolute host NAS path}
        bind:
          create_host_path: false
      - type: bind
        source: ${FLEET_DOCKER_SOCKET:-/var/run/docker.sock}
        target: /var/run/docker.sock
        bind:
          create_host_path: false
