[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "deerflow-c04-runtime-fixture"
version = "0.1.0"
requires-python = ">=3.12"
[tool.hatch.build.targets.wheel]
packages = ["deerflow_c04_fixture"]

[project.entry-points."deerflow.fleet.agent_environment"]
ambiguous = "deerflow_c04_alternate:factory"

c07-omit-seal = "fleet.c07_integration_fixture:installed_omitting_seal_environment"

c08-staged = "fleet.c08_linux_fixture:build_environment"

c08-stock = "fleet.c08_stock_linux_fixture:build_environment"

c08-continuation = "fleet.c08_continuation_fixture:build_environment"

c07-installed = "fleet.c07_integration_fixture:installed_c07_environment"

c07-stock = "fleet.c07_integration_fixture:installed_c07_stock_environment"
