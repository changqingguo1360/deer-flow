[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "deerflow-c04-alternate-provider"
version = "0.1.0"
requires-python = ">=3.12"
[project.entry-points."deerflow.fleet.agent_environment"]
alternate = "deerflow_c04_alternate:factory"
ambiguous = "deerflow_c04_alternate:factory"
unfit = "deerflow_c04_alternate:unfit"
invalid = "deerflow_c04_alternate:invalid"
noncallable = "deerflow_c04_alternate:sentinel"
[tool.hatch.build.targets.wheel]
packages = ["deerflow_c04_alternate"]
