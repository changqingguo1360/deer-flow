[project]
name = "deerflow-ecs-fleet"
version = "0.1.0"
description = "Durable jobs and remote Agent execution on a fixed ECS fleet"
requires-python = ">=3.12"
dependencies = [
    "deerflow-harness>=2.1,<3",
    "deerflow-extension-api>=0.2,<0.3",
    "pydantic>=2.10,<3",
    "SQLAlchemy[asyncio]>=2.0,<3",
    "alembic>=1.14,<2",
    "asyncpg>=0.29,<1",
    "httpx>=0.28,<1",
]

[project.entry-points."deerflow.extensions"]
ecs-fleet = "deerflow_ecs_fleet:install"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deerflow_ecs_fleet"]

[tool.ruff]
line-length = 240
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
